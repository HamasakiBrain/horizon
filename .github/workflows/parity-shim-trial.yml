name: parity shim trial
# Trial (2026-11-20, #18776): the 35 harnesses of ci/parity-blacksmith-trial, twice on one Blacksmith runner with this
# branch's oracle shim: cold, then warm with PARITY_SHIM_VERIFY=1 (every replay is run and compared). Each parity.py run
# prints the shim's summary (reasons, Java seconds run and replayed). Pushes to this branch only; never a pull request.
# Only the fetch step gets the secrets. No cache, no sticky disk, nothing uploaded: the runner is thrown away.
on:
  push:
    branches: [ci/shim-verify-trial]
permissions:
  contents: read

jobs:
  twice:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      HORIZON_TELEMETRY_URL: "off"
      HORIZON_NO_SCCACHE: "1"
      CARGO_BUILD_JOBS: "16"
      PARITY_LOCAL_JOBS: "8"
      PARITY_MACHINE_JOBS: "8"
      PARITY_HOSTS: ''
      HARNESSES: >-
        food java_hash_map block_properties block_state_codec collision fluid_shape heightmap item_cooldowns
        item_durability status_effect attribute damage_source fall_damage piston_shape simple_container snbt_unicode
        world_border biome_zoom rule_test value_provider height_provider carving_mask
        enchanting light hud scoreboard team_rules stack_foil hotbar container_title chest_pair recipe_book
        spawn_loot composter boat_authority
    steps:
      - name: Paths
        run: |
          {
            echo "VANILLA=$RUNNER_TEMP/vanilla"
            echo "HORIZON_SHARED_SOURCE=$RUNNER_TEMP/vanilla/shared-local"
            echo "HORIZON_PREPARED_CACHE=$RUNNER_TEMP/vanilla/prepared"
            echo "PARITY_SHARED=$RUNNER_TEMP/vanilla/parity-shared"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The JDK research-lock.json pins
        id: lock
        run: |
          echo "java=$(sed -n 's/.*"java_major": *\([0-9]*\).*/\1/p' research-lock.json | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build and screen packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config cmake libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 xvfb libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 \
            libxkbcommon-x11-0 libgl1 libegl1 > /dev/null
      - name: A virtual screen
        run: |
          Xvfb :90 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          [ -n "$icd" ] || { echo "::error::no lavapipe driver file"; exit 1; }
          { echo "DISPLAY=:90"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.java }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - name: Tools from the runner
        run: bash tools/ci/runner-env.sh
      - name: Fetch the vanilla data
        env:
          VANILLA_DATA_DEPLOY_KEY: ${{ secrets.VANILLA_DATA_DEPLOY_KEY }}
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
        run: bash tools/ci/fetch-vanilla-data.sh 26.3-linux-x64 "$HORIZON_SHARED_SOURCE"
      - name: Vanilla data, and resources prepared by this preparer
        run: bash tools/ci/vanilla-data.sh
      - name: Cold (records every oracle run)
        run: |
          set -o pipefail
          start=$(date +%s)
          python3 tools/parity.py --timeout 1500 $HARNESSES 2>&1 | tee "$RUNNER_TEMP/cold.out" || true
          echo "cold run $(( $(date +%s) - start )) s"
      - name: Warm, every replay verified
        env:
          PARITY_SHIM_VERIFY: "1"
        run: |
          set -o pipefail
          start=$(date +%s)
          status=0
          python3 tools/parity.py --timeout 1500 $HARNESSES 2>&1 | tee "$RUNNER_TEMP/warm.out" || status=$?
          echo "warm run $(( $(date +%s) - start )) s"
          exit "$status"
      - name: Warm again, replaying (no verification)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          start=$(date +%s)
          python3 tools/parity.py --timeout 1500 $HARNESSES 2>&1 | tee "$RUNNER_TEMP/replay.out" || true
          echo "replay run $(( $(date +%s) - start )) s"
      - name: Results per run
        if: always()
        run: |
          for run in cold warm replay; do
            [ -f "$RUNNER_TEMP/$run.out" ] || continue
            echo "== $run: $(grep -cE '^PASS ' "$RUNNER_TEMP/$run.out") PASS, $(grep -cE '^FAIL ' "$RUNNER_TEMP/$run.out") FAIL, $(grep -c '^retry ' "$RUNNER_TEMP/$run.out") retried"
            grep -E '^(FAIL|retry|RETRIED|VERIFY FAILED|  Java|  Most|  Variables|  VERIFY)' "$RUNNER_TEMP/$run.out" || true
          done
